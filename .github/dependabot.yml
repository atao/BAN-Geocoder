# Mises à jour automatiques des dépendances (Dependabot).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      timezone: Europe/Paris
    groups:
      github_actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      timezone: Europe/Paris
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
